<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Tales of Bharat{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
 <div class="temple-skyline" aria-hidden="true">
  <svg viewBox="0 0 600 120" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,120 L0,90 L30,90 L30,70 L50,70 L50,50 L70,50 L70,30 L90,30 L90,10 L110,10 L110,30 L130,30 L130,50 L150,50 L150,70 L170,70 L170,90 L200,90 L200,120 Z" fill="currentColor"/>
    <path d="M220,120 L220,95 L245,95 L245,75 L265,75 L265,55 L290,55 L290,75 L310,75 L310,95 L335,95 L335,120 Z" fill="currentColor"/>
    <path d="M355,120 L355,100 L375,100 L375,80 L400,80 L400,60 L420,60 L420,40 L440,40 L440,20 L460,20 L460,40 L480,40 L480,60 L500,60 L500,80 L525,80 L525,100 L545,100 L545,120 Z" fill="currentColor"/>
    <path d="M565,120 L565,95 L590,95 L590,75 L600,75 L600,120 Z" fill="currentColor"/>
    <circle cx="100" cy="6" r="3" fill="currentColor"/>
    <circle cx="440" cy="16" r="3" fill="currentColor"/>
    <ellipse class="myth-flame" cx="50" cy="64" rx="2.4" ry="5" fill="var(--gold-bright)"/>
    <ellipse class="myth-flame myth-flame-2" cx="290" cy="49" rx="2.6" ry="5.5" fill="var(--gold-bright)"/>
    <ellipse class="myth-flame myth-flame-3" cx="460" cy="14" rx="2.4" ry="5" fill="var(--gold-bright)"/>
  </svg>
</div> 
<div class="page">
  <div class="eyebrow">A Mythology Quiz</div>

  {% if session.get('username') %}
  <div class="nav">
    <span class="nav-user">{{ session['username'] }}</span>
    <a href="{{ url_for('leaderboard') }}">Leaderboard</a>
    <a href="{{ url_for('logout') }}">Log out</a>
    <span class="lang-toggle">
      <a href="{{ url_for('set_language', lang='en') }}" class="{{ 'lang-active' if session.get('lang', 'en') == 'en' else '' }}">EN</a>
      <span class="lang-sep">/</span>
      <a href="{{ url_for('set_language', lang='hi') }}" class="{{ 'lang-active' if session.get('lang', 'en') == 'hi' else '' }}">हि</a>
    </span>
  </div>
  {% endif %}

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">
        {% for m in messages %}<div>{{ m }}</div>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="card">
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
